name: Swift tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: swift test
      - run: npm --prefix server test
      - run: python3 scripts/test_release_configuration.py
